databases:
  - name: bharosa-db-new
    databaseName: bharosa_new
    user: bharosa_user_new
    plan: free
    region: oregon

services:
  - type: web
    name: bharosa-api-new
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w packages/shared-contracts && npm run build -w services/api
    startCommand: node services/api/dist/server.js
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bharosa-db-new
          property: connectionString
