name: field_app
description: "Bharosa — Closing the Care Loop · ASHA field app (v1 minimal prototype: caseload, triage, referral, emergency bypass)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local persistence — drift over sqlite (v1 uses sqlite3_flutter_libs; SQLCipher AES-256 is v2)
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1

  # Offline / connectivity / sync
  connectivity_plus: ^6.0.5
  http: ^1.3.0
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6

  # Field capture
  mobile_scanner: ^7.4.0
  qr_flutter: ^4.1.0

  # Emergency GSM + audio — another_telephony is the maintained fork of telephony with AGP 8 namespace fix
  another_telephony: ^0.4.1
  flutter_tts: ^4.2.2

  # State
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.22.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/locale/
