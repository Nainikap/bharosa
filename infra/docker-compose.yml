version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bharosa-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bharosa
      POSTGRES_PASSWORD: bharosa_dev
      POSTGRES_DB: bharosa
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
